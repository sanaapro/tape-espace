<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0F">
<title>SanaaPro Catalogue — Gambian tailors</title>
<meta name="description" content="Browse designs from tailoring workshops across The Gambia and order on WhatsApp.">
<meta property="og:title" content="SanaaPro Catalogue — Gambian tailors">
<meta property="og:description" content="Designs from workshops across The Gambia. Order directly on WhatsApp.">
<meta property="og:image" content="https://sanaapro.github.io/tape-espace/icon-512.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest-catalogue.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SanaaPro Style">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://firestore.googleapis.com">
<style>
  :root{
    --bg:#0E0E0F; --panel:#17171A; --line:#2A2A2F; --ink:#F3EEE3; --muted:#9C978C; --gold:#C9A227;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{ box-sizing:inherit }
  html,body{ margin:0; background:var(--bg); color:var(--ink) }
  body{ font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-text-size-adjust:100% }
  .wrap{ max-width:720px; margin:0 auto; padding:18px 16px 40px }
  header{ display:flex; align-items:center; gap:10px }
  header img{ width:32px; height:32px; border-radius:8px }
  .brand{ font-family:Georgia,"Times New Roman",serif; font-size:17px; flex:1 }
  .lang{ background:none; border:1px solid var(--line); color:var(--muted); border-radius:20px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer }
  .install{ background:var(--gold); border:1px solid var(--gold); color:#16130B; border-radius:20px; padding:5px 12px; font:inherit; font-size:13px; font-weight:600; cursor:pointer }
  .ioshelp{ margin:14px 0 0; padding:12px 14px; border:1px solid var(--gold); border-radius:12px; background:var(--panel); font-size:14px; line-height:1.45 }
  .ioshelp button{ float:right; background:none; border:none; color:var(--muted); font-size:18px; line-height:1; cursor:pointer; padding:0 0 0 10px }
  h1{ font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:31px; line-height:1.18; margin:28px 0 8px; max-width:15em }
  .lead{ color:var(--muted); margin:0 0 22px; max-width:34em }

  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none }
  .chips::-webkit-scrollbar{ display:none }
  .chip{ flex:none; border:1px solid var(--line); background:none; color:var(--muted); border-radius:999px; padding:8px 15px; font:inherit; font-size:14px; cursor:pointer }
  .chip.on{ background:var(--gold); border-color:var(--gold); color:#16130B; font-weight:600 }
  select{ width:100%; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; margin-bottom:16px }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px }
  .item{ align-self:start; display:block; width:100%; background:none; border:0; padding:0; text-align:left; color:inherit; font:inherit; cursor:pointer }
  .item img{ display:block; width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; background:var(--panel) }
  .item .t{ margin-top:8px; font-size:14.5px; line-height:1.3 }
  .item .s{ font-size:12.5px; color:var(--muted); margin-top:2px }
  .item .p{ font-size:13px; color:var(--gold); margin-top:2px }
  .item:focus-visible,.chip:focus-visible,.cta:focus-visible{ outline:2px solid var(--gold); outline-offset:3px }

  .more{ display:block; margin:24px auto 0; background:none; border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px 22px; font:inherit; cursor:pointer }
  .state{ text-align:center; color:var(--muted); padding:50px 10px }
  .foot{ text-align:center; color:var(--muted); font-size:12.5px; margin-top:36px }
  .foot a{ color:var(--gold); text-decoration:none }

  /* fiche d'un modèle */
  #shv{ z-index:9 }
  .sheet{ position:fixed; inset:0; background:var(--bg); overflow-y:auto; z-index:10;
          padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px) }
  .sheet .in{ max-width:560px; margin:0 auto; padding:14px 16px 32px }
  .close{ background:none; border:1px solid var(--line); color:var(--ink); border-radius:20px; padding:6px 14px; font:inherit; font-size:14px; cursor:pointer }
  .big{ display:block; width:100%; margin-top:14px; border-radius:12px; background:var(--panel); min-height:240px; object-fit:cover }
  .sheet h2{ font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:26px; margin:18px 0 4px }
  .who{ color:var(--muted); margin:0 }
  .price{ color:var(--gold); font-size:17px; margin:10px 0 0 }
  .cta{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; min-height:52px; margin-top:22px;
        background:var(--gold); color:#16130B; border-radius:12px; font-weight:600; font-size:16px; text-decoration:none }
  .cta svg{ width:20px; height:20px }
  .wave{ margin-top:16px; border:1px solid var(--line); border-radius:12px; padding:14px 16px; text-align:center }
  .wave .wt{ display:block; color:var(--muted); font-size:13.5px }
  .wave .wn{ display:block; font-size:22px; letter-spacing:.5px; margin:4px 0 2px; color:#1DC8F2; font-weight:600 }
  .wave .wh{ display:block; color:var(--muted); font-size:12.5px; margin-top:6px; line-height:1.4 }
  .wave button{ margin-top:10px; background:none; border:1px solid var(--line); color:var(--ink); border-radius:20px; padding:7px 16px; font:inherit; font-size:13.5px; cursor:pointer }
  .wave button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px }
  .wave .wavego{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:52px; margin:0 0 12px;
         background:#1DC8F2; color:#04121A; border:0; border-radius:12px; font-size:16.5px; font-weight:700 }
  .wave .wavego .wl{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%;
         background:#04121A; color:#1DC8F2; font-size:15px; font-weight:800 }
  /* ateliers */
  .shops-t{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:6px 0 8px }
  .shops{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px; scrollbar-width:none }
  .shops::-webkit-scrollbar{ display:none }
  .shop{ flex:none; display:flex; flex-direction:column; gap:2px; min-width:150px; max-width:220px; padding:12px 14px;
         border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--ink); text-decoration:none }
  .shop b{ font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:16px; line-height:1.25 }
  .shop span{ font-size:12.5px; color:var(--muted) }
  .shop .n{ color:var(--gold) }
  .shop:focus-visible,.shopbar a:focus-visible,.shopbar button:focus-visible,.seeshop:focus-visible{ outline:2px solid var(--gold); outline-offset:2px }
  .shopbar{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 22px }
  .shopbar a,.shopbar button{ flex:1 1 150px; display:flex; align-items:center; justify-content:center; min-height:46px; border-radius:11px;
         font:inherit; font-weight:600; font-size:14.5px; text-decoration:none; cursor:pointer }
  .shopbar a{ background:var(--gold); color:#16130B; border:0 }
  .shopbar button{ background:none; color:var(--ink); border:1px solid var(--line) }
  .seeshop{ display:block; margin-top:18px; padding:13px 14px; border:1px solid var(--line); border-radius:12px; color:var(--gold); text-decoration:none; text-align:center }
  /* sélection de plusieurs modèles */
  .cell{ position:relative; align-self:start }
  /* zone tactile de 40 px, pastille visible de 24 px */
  .pick{ position:absolute; top:2px; right:2px; width:40px; height:40px; padding:0; border:0; background:none;
         display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent }
  .pick .dot{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
              background:rgba(14,14,15,.42); border:1px solid rgba(255,255,255,.75); color:#fff;
              -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); transition:background .15s, border-color .15s }
  .pick svg{ width:12px; height:12px }
  .pick.on .dot{ background:var(--gold); border-color:var(--gold); color:#16130B }
  .pick:focus-visible{ outline:none }
  .pick:focus-visible .dot{ outline:2px solid var(--gold); outline-offset:2px }
  .cell.on .item img{ outline:2px solid var(--gold); outline-offset:-2px }
  .selbar{ position:fixed; z-index:5; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
           max-width:560px; margin:0 auto; display:flex; align-items:center; gap:10px; min-height:56px; padding:8px 8px 8px 14px;
           background:var(--gold); color:#16130B; border:0; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.45);
           font:inherit; font-weight:600; font-size:15px; text-align:left; cursor:pointer }
  .selbar .cnt{ flex:none; display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 8px;
                border-radius:999px; background:#16130B; color:var(--gold); font-weight:700 }
  .selbar .go{ flex:none; margin-left:auto; padding:9px 14px; border-radius:10px; background:#16130B; color:var(--gold); white-space:nowrap }
  .selbar:focus-visible{ outline:2px solid #fff; outline-offset:2px }
  body.hasbar .wrap{ padding-bottom:110px }
  .addsel{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px; margin-top:12px;
           background:none; border:1px solid var(--gold); color:var(--gold); border-radius:12px; font:inherit; font-weight:600; font-size:15.5px; cursor:pointer }
  .addsel.on{ border-color:var(--line); color:var(--muted) }
  .addsel:focus-visible{ outline:2px solid var(--gold); outline-offset:2px }
  .grp{ margin-top:22px; padding-top:16px; border-top:1px solid var(--line) }
  .grp h3{ font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:19px; margin:0 0 2px }
  .grp .q{ color:var(--muted); font-size:13px; margin:0 0 6px }
  .row{ display:flex; align-items:center; gap:12px; padding:9px 0 }
  .row img,.row .ph{ flex:none; width:52px; height:68px; object-fit:cover; border-radius:8px; background:var(--panel) }
  .row .tx{ flex:1; min-width:0 }
  .row .tx b{ display:block; font-weight:normal; font-size:15px; line-height:1.3 }
  .row .tx span{ display:block; font-size:12.5px; color:var(--muted) }
  .row .tx i{ display:block; font-style:normal; font-size:13px; color:var(--gold) }
  .row .rm{ flex:none; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:none; color:var(--muted); font-size:20px; line-height:1; cursor:pointer }
  .row .rm:focus-visible{ outline:2px solid var(--gold); outline-offset:2px }
  .sub{ display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:14px; margin:6px 0 0 }
  .sub b{ color:var(--gold); font-weight:600 }
  .grp .cta{ margin-top:12px }
  .shitem{ display:block; width:100%; margin-top:20px; padding:0; background:none; border:0; color:inherit; font:inherit; text-align:left; cursor:pointer }
  .shitem img{ display:block; width:100%; max-height:520px; object-fit:cover; border-radius:12px; background:var(--panel); min-height:200px }
  .shitem .n{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:var(--gold); color:#16130B; font-weight:700; font-size:13.5px; margin-right:8px }
  .shitem b{ display:flex; align-items:center; font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:20px; margin-top:12px }
  .shitem span{ display:block; color:var(--muted); font-size:13px; margin-top:2px }
  .shitem i{ display:block; font-style:normal; color:var(--gold); font-size:15.5px; margin-top:2px }
  .shitem:focus-visible{ outline:2px solid var(--gold); outline-offset:3px }
  #shv-total{ margin-top:22px; padding-top:14px; border-top:1px solid var(--line); font-size:15px }
  .note{ color:var(--muted); font-size:13px; line-height:1.45; margin:22px 0 0 }
  .clear{ display:block; margin:18px auto 0; background:none; border:0; color:var(--muted); text-decoration:underline; font:inherit; font-size:14px; cursor:pointer; padding:10px }
  .toast{ position:fixed; z-index:20; left:12px; right:12px; bottom:calc(80px + env(safe-area-inset-bottom,0px)); max-width:560px; margin:0 auto;
           display:flex; align-items:center; gap:12px; padding:12px 12px 12px 16px; border-radius:12px;
           background:#F3EEE3; color:#16130B; font-size:14.5px; box-shadow:0 8px 24px rgba(0,0,0,.45) }
  .toast span{ flex:1 }
  .toast button{ flex:none; background:none; border:1px solid #16130B; color:#16130B; border-radius:8px; padding:7px 12px; font:inherit; font-weight:600; cursor:pointer }
  /* Mes modèles (favoris) et compte client */
  #favp{ z-index:9 }
  .favh{ display:inline-flex; align-items:center; gap:5px; background:none; border:1px solid var(--line); color:var(--ink); border-radius:20px; padding:5px 11px; font:inherit; font-size:13px; cursor:pointer }
  .favh svg{ width:15px; height:15px; fill:var(--gold) }
  .favh:focus-visible{ outline:2px solid var(--gold); outline-offset:2px }
  .heart{ position:absolute; top:2px; left:2px; width:40px; height:40px; padding:0; border:0; background:none;
          display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent }
  .heart .dot{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
               background:rgba(14,14,15,.42); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px) }
  .heart svg{ width:16px; height:16px; fill:none; stroke:#fff; stroke-width:2.2 }
  .heart.on svg{ fill:#E0475B; stroke:#E0475B }
  .heart.pop svg{ animation:hpop .32s ease }
  @keyframes hpop{ 40%{ transform:scale(1.35) } }
  .heart:focus-visible{ outline:none } .heart:focus-visible .dot{ outline:2px solid var(--gold); outline-offset:2px }
  .favbtn.on{ border-color:#E0475B; color:#E0475B }
  .acct{ margin:18px 0 22px; padding:16px; border:1px solid var(--line); border-radius:14px; background:var(--panel) }
  .acct p{ margin:0 0 12px; font-size:14.5px; line-height:1.45 }
  .acct .ok{ color:var(--ink) } .acct .ok b{ color:var(--gold); font-weight:600 }
  .acct .btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:48px; margin-top:10px; border-radius:11px;
              font:inherit; font-weight:600; font-size:15px; cursor:pointer; border:1px solid var(--line); background:none; color:var(--ink) }
  .acct .btn.g{ background:#fff; color:#1F1F1F; border-color:#fff }
  .acct .btn.g svg{ width:18px; height:18px }
  .acct .btn.gold{ background:var(--gold); border-color:var(--gold); color:#16130B }
  .acct input{ display:block; width:100%; margin-top:10px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:12px; font:inherit; font-size:16px }
  .acct input:focus{ outline:none; border-color:var(--gold) }
  .acct .tabs{ display:flex; gap:6px; margin-bottom:4px }
  .acct .tabs button{ flex:1; background:none; border:0; border-bottom:2px solid var(--line); color:var(--muted); padding:8px 4px; font:inherit; font-size:14px; cursor:pointer }
  .acct .tabs button.on{ border-color:var(--gold); color:var(--ink) }
  .acct .err{ color:#F08A8A; font-size:13.5px; margin:10px 0 0 } .acct .msg{ color:#8FD19E; font-size:13.5px; margin:10px 0 0 }
  .acct .lnk{ background:none; border:0; color:var(--muted); text-decoration:underline; font:inherit; font-size:13.5px; cursor:pointer; padding:10px 0 0 }
  .acct .or{ text-align:center; color:var(--muted); font-size:12.5px; margin:12px 0 0 }
  .favgrid .gone img{ opacity:.35 } .favgrid .gone .s{ color:#F08A8A }
  [hidden]{ display:none !important }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon-192.png" alt="" width="32" height="32">
    <div class="brand">SanaaPro</div>
    <a class="lang" id="toapp" href="index.html" hidden style="text-decoration:none;color:var(--gold)"></a>
    <button class="favh" id="favh" type="button" aria-label="My designs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3s-7.6-4.6-9.3-9.2C1.5 7.6 3.9 4.2 7.4 4.2c2 0 3.5 1.1 4.6 2.7 1.1-1.6 2.6-2.7 4.6-2.7 3.5 0 5.9 3.4 4.7 6.9-1.7 4.6-9.3 9.2-9.3 9.2Z"/></svg><span id="favh-n"></span></button>
    <button class="install" id="install" type="button" hidden></button>
    <button class="lang" id="lang" type="button">FR</button>
  </header>
  <div class="ioshelp" id="ioshelp" hidden><button type="button" id="ioshelp-x" aria-label="Close">×</button><span id="ioshelp-t"></span></div>

  <a id="allshops" href="catalogue.html" hidden style="display:inline-block;margin-top:22px;color:var(--gold);text-decoration:none;font-size:14px"></a>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>

  <div class="chips" id="chips"></div>
  <div class="chips" id="styles"></div>
  <select id="quartier" aria-label="Neighbourhood"></select>
  <select id="shop" aria-label="Workshop" hidden></select>
  <div id="shopsbox" hidden>
    <div class="shops-t" id="shops-t"></div>
    <div class="shops" id="shops"></div>
  </div>
  <div class="shopbar" id="shopbar" hidden>
    <a id="shop-wa" target="_blank" rel="noopener"></a>
    <button type="button" id="shop-share"></button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="state" id="state"></div>
  <button class="more" id="more" hidden></button>

  <p class="foot"><span id="foot"></span> <a href="https://sanaapro.github.io/">SanaaPro</a></p>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="in">
    <button class="close" id="close" type="button"></button>
    <img class="big" id="big" alt="">
    <h2 id="s-title"></h2>
    <p class="who" id="s-who"></p>
    <p class="price" id="s-price"></p>
    <a class="cta" id="s-cta" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3Z"/></svg>
      <span id="s-cta-t"></span>
    </a>
    <button type="button" class="addsel favbtn" id="s-fav"></button>
    <button type="button" class="addsel" id="s-pick"></button>
    <div class="wave" id="wave" hidden>
      <button type="button" class="wavego" id="wave-go"><span class="wl">W</span><span id="wave-go-t"></span></button>
      <span class="wt" id="wave-t"></span>
      <span class="wn" id="wave-n"></span>
      <button type="button" id="wave-copy"></button>
      <span class="wh" id="wave-h"></span>
    </div>
    <a class="seeshop" id="s-shop" hidden></a>
  </div>
</div>

<button type="button" class="selbar" id="selbar" hidden><span class="cnt" id="selbar-n"></span><span id="selbar-t"></span><span class="go" id="selbar-go"></span></button>

<div class="toast" id="toast" hidden role="status"></div>

<div class="sheet" id="shv" hidden role="dialog" aria-modal="true" aria-labelledby="shv-h">
  <div class="in">
    <button class="close" id="shv-close" type="button"></button>
    <h2 id="shv-h"></h2>
    <p class="who" id="shv-lead"></p>
    <div id="shv-list"></div>
    <div class="sub" id="shv-total" hidden></div>
  </div>
</div>

<div class="sheet" id="favp" hidden role="dialog" aria-modal="true" aria-labelledby="favp-h">
  <div class="in">
    <button class="close" id="favp-close" type="button"></button>
    <h2 id="favp-h"></h2>
    <p class="who" id="favp-lead"></p>
    <div class="acct" id="acct"></div>
    <div class="grid favgrid" id="favgrid"></div>
    <p class="note" id="favp-empty" hidden></p>
  </div>
</div>

<div class="sheet" id="selp" hidden role="dialog" aria-modal="true" aria-labelledby="selp-h">
  <div class="in">
    <button class="close" id="selp-close" type="button"></button>

  function saveSel(){ try{ localStorage.setItem(SEL_KEY, JSON.stringify(SEL)); }catch(e){} }
  function isSel(o){ return SEL.some(function(x){ return x.id === o.id; }); }
  function toggleSel(o){
    if(isSel(o)) SEL = SEL.filter(function(x){ return x.id !== o.id; });

      if(SEL.length >= SEL_MAX){ alert(L().max.replace("{n}", SEL_MAX)); return; }
      var th = (o.thumb && String(o.thumb).length < 60000) ? o.thumb : "";

                 wa:o.wa||"", prix:(o.prix!==null && o.prix!==undefined) ? Number(o.prix) : null, devise:o.devise||"D",
                 subExpMs:o.subExpMs||null, thumb:th });
    }
    saveSel(); refreshSel();
  }
  function refreshSel(){
    var t = L(), n = SEL.length;
    Array.prototype.forEach.call(document.querySelectorAll(".cell"), function(c){
      var on = SEL.some(function(x){ return x.id === c.dataset.id; });

      b.setAttribute("aria-pressed", on ? "true" : "false"); b.setAttribute("aria-label", t.pickAria);

    $("selbar").hidden = !n || !$("selp").hidden;

  }
  var SHORT_BASE = "https://sanaapro.github.io/c?";
  function selLink(items){
    var ok = location.hostname === "sanaapro.github.io" &&
             items.every(function(x){ return /^[A-Za-z0-9]{5,}$/.test(x.id); });
    if(ok) return SHORT_BASE + items.map(function(x){ return x.id.slice(0,5); }).join("");
    var base = location.origin + location.pathname;
    return items.length === 1 ? base + "?m=" + encodeURIComponent(items[0].id)
                              : base + "?s=" + items.map(function(x){ return encodeURIComponent(x.id); }).join(".");
  }
  function selMessage(items){
    var t = L(), lines = [items.length === 1 ? t.mOne : t.mMany.replace("{n}", items.length)];
    items.forEach(function(x, i){
      var l = (i+1) + ". " + (x.titre || "—");
      if(x.prix !== null && x.prix !== undefined) l += " — " + amt(x.prix, x.devise);
      lines.push(l);
    });
    lines.push("");
    lines.push((items.length === 1 ? t.mSee1 : t.mSeeN) + " " + selLink(items));
    lines.push(""); lines.push(t.mEnd);
    return lines.join("\n");
  }
  function paintSel(){
    var t = L(), box = $("selp-list"); box.innerHTML = "";
    $("selp-h").textContent = t.selH; $("selp-lead").textContent = t.selLead;

    $("selp-note").hidden = false; $("selp-clear").hidden = false;

            refreshSel();
            toast(L().sentOk, function(){ SEL = before; saveSel(); refreshSel(); });
          }, 400);
        });
        g.appendChild(c);

  var TOAST_T = null;
  function toast(msg, undo){

  function shopQuery(field){
    var body = { structuredQuery: { from:[{ collectionId:"catalogue" }],
      where:{ fieldFilter:{ field:{ fieldPath:field }, op:"EQUAL", value:{ stringValue: ONLY } } }, limit: 300 } };
    return fetch(BASE.replace(/\/$/, "") + ":runQuery?key=" + KEY, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) })
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){ return rows.filter(function(x){ return x.document; }); });
  }
  function loadShop(){
    LOADING = true; paintState();
    shopQuery("slug")
    .then(function(rows){ return rows.length ? rows : shopQuery("bid"); })
    .then(function(rows){
      rows.forEach(function(x){ ITEMS.push(parse(x.document)); });
      if(ITEMS.length) SHOP = ITEMS[0].bid || SHOP;
      ITEMS.sort(function(a,b){ return (Number(b.createdMs)||0) - (Number(a.createdMs)||0); });
      NEXT = null; FAILED = false;
    }).catch(function(){ FAILED = true; })
    .then(function(){ LOADING = false; paint(); });
  }
  function load(){
    if(ONLY) return loadShop();
    if(LOADING) return; LOADING = true; paintState();
    var url = BASE + "catalogue?pageSize=24&orderBy=createdMs%20desc&key=" + KEY + (NEXT ? "&pageToken=" + encodeURIComponent(NEXT) : "");
    fetch(url, { cache:"no-store" }).then(function(r){ if(!r.ok) throw 0; return r.json(); })

      (j.documents || []).forEach(function(d){ var o = parse(d); if(!hiddenShop(o)) ITEMS.push(o); });
      NEXT = j.nextPageToken || null; FAILED = false;

    .then(function(){ LOADING = false; paint(); });
  }

    var areas = {}; ITEMS.forEach(function(o){ var q = (o.quartier||"").trim(); if(q && !areas[q.toLowerCase()]) areas[q.toLowerCase()] = q; });

    });
    qs.value = AREA;
    qs.hidden = ONLY || Object.keys(areas).length < 2;

    var liveItems = ITEMS.filter(live);
    var cnt = function(n){ return n === 1 ? t.design1 : t.designs.replace("{n}", n); };
    if(ONLY && liveItems.length){
      var o1 = liveItems[0];
      $("lead").textContent = (o1.quartier ? o1.quartier + " · " : "") + cnt(liveItems.length) + " · " + t.shopLead;
      $("shopbar").hidden = false;
      $("shop-share").textContent = t.shopShare;

        $("shop-wa").textContent = t.shopWa;

      var cell = document.createElement("div"); cell.className = "cell" + (gone ? " gone" : "");
      var b = document.createElement("button"); b.type = "button"; b.className = "item";
      var im = document.createElement("img"); im.src = o.thumb || ""; im.alt = o.titre || ""; im.loading = "lazy"; b.appendChild(im);
      var a = document.createElement("div"); a.className = "t"; a.textContent = o.titre || "—"; b.appendChild(a);
      var s = document.createElement("div"); s.className = "s"; s.textContent = gone ? x.gone : (o.boutique || "") + (o.quartier ? " · " + o.quartier : ""); b.appendChild(s);
      if(!gone && o.prix !== null && o.prix !== undefined){ var p = document.createElement("div"); p.className = "p"; p.textContent = (C.lang() === "fr" ? "dès " : "from ") + C.money(o); b.appendChild(p); }
      if(!gone) b.addEventListener("click", function(){ C.openSheet(o); });
      cell.appendChild(b); cell.appendChild(heart(o));
      g.appendChild(cell);
    });
    paintAcct();
  }

  // Recharge les modèles gardés depuis le catalogue (prix à jour, vignettes, modèles retirés).
  var FRESH_AT = 0;
  function freshen(force){
    if(!FAV.length || (!force && Date.now() - FRESH_AT < 60000)) return Promise.resolve();
    FRESH_AT = Date.now();
    return batchGet(ids()).then(function(map){
      if(!map) return;
      FAV = FAV.map(function(x){
        var d = map[x.id];
        if(d === undefined) return x;            // pas de réponse : on garde tel quel
        if(d === null){ var g = Object.assign({}, x); g._gone = true; return g; }
        var y = snap(d); y.savedMs = x.savedMs || y.savedMs; return y;
      });
      store(); refresh();
    });
  }
  function batchGet(list){
    if(!list.length) return Promise.resolve({});
    var chunks = []; for(var i = 0; i < list.length; i += 100) chunks.push(list.slice(i, i + 100));
    var out = {};
    return Promise.all(chunks.map(function(ch){
      return fetch("https://firestore.googleapis.com/v1/" + ROOT.replace(/\/$/, "") + ":batchGet?key=" + C.key, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ documents: ch.map(function(id){ return ROOT + "catalogue/" + id; }) })
      }).then(function(r){ return r.ok ? r.json() : null; }).then(function(rows){
        (rows || []).forEach(function(r){
          if(r.found) out[r.found.name.split("/").pop()] = C.parse(r.found);
          else if(r.missing) out[r.missing.split("/").pop()] = null;
        });
      });
    })).then(function(){ return out; }).catch(function(){ return null; });
  }

  // ---- compte client ----
  var AUTH = null, MOD = null, USER = null, MODE = "new", SHOW_FORM = false, BUSY = false, ERR = "", MSG = "";
  function loadAuth(){
    if(MOD) return Promise.resolve(MOD);
    return Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-auth.js")]).then(function(m){
      var app = m[0].initializeApp(CFG, "sanaapro-clients");
      MOD = m[1]; AUTH = MOD.getAuth(app);
      try{ AUTH.languageCode = C.lang(); }catch(e){}
      MOD.onAuthStateChanged(AUTH, function(u){
        USER = u || null;
        try{ if(u) localStorage.setItem(KEY_SIGNED, "1"); else localStorage.removeItem(KEY_SIGNED); }catch(e){}
        paintAcct();
        if(u) pull();
      });
      return MOD;
    });
  }
  function fail(e){
    BUSY = false;
    var code = (e && e.code) || "";
    if(code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request"){ ERR = ""; paintAcct(); return; }
    ERR = t().e[code] || (e === "load" ? t().e.load : t().e.x); MSG = ""; paintAcct();
  }
  function withAuth(fn){
    BUSY = true; ERR = ""; MSG = ""; paintAcct();
    loadAuth().then(function(){ return fn(); }).then(function(){ BUSY = false; paintAcct(); })
      .catch(function(e){ fail(e && e.code ? e : (MOD ? e : "load")); });
  }
  function google(){
    withAuth(function(){ return MOD.signInWithPopup(AUTH, new MOD.GoogleAuthProvider()); });
  }
  function emailGo(){
    var em = ($("ac-mail").value || "").trim(), pw = $("ac-pass").value || "";
    withAuth(function(){
      return MODE === "new" ? MOD.createUserWithEmailAndPassword(AUTH, em, pw) : MOD.signInWithEmailAndPassword(AUTH, em, pw);
    });
  }
  function reset(){
    var em = ($("ac-mail").value || "").trim();
    if(!em){ ERR = t().e["auth/invalid-email"]; paintAcct(); return; }
    withAuth(function(){ return MOD.sendPasswordResetEmail(AUTH, em).then(function(){ MSG = t().sentReset.replace("{e}", em); }); });
  }
  function signOut(){
    if(!confirm(t().outQ)) return;
    loadAuth().then(function(){ return MOD.signOut(AUTH); }).then(function(){
      FAV = []; store(); refresh();          // téléphone partagé : on ne laisse pas la liste derrière soi
    }).catch(function(){});
  }

  function paintAcct(){
    var box = $("acct"); if(!box || $("favp").hidden) return;
    var x = t(), h = "";
    var keepMail = $("ac-mail") ? $("ac-mail").value : "", keepPass = $("ac-pass") ? $("ac-pass").value : "";
    if(USER){
      h = '<p class="ok">✓ ' + esc(x.ok) + '<br><b>' + esc(USER.email || "") + '</b></p>' +
          '<button type="button" class="btn" id="ac-out">' + esc(x.out) + '</button>';
    } else {
      h = '<p>' + esc(x.pitch) + '</p>' +
          '<button type="button" class="btn g" id="ac-g">' + GLOGO + esc(x.google) + '</button>';
      if(!SHOW_FORM) h += '<button type="button" class="btn" id="ac-e">' + esc(x.email) + '</button>';
      else h += '<p class="or">' + esc(x.or) + '</p>' +
          '<div class="tabs"><button type="button" id="ac-tn" class="' + (MODE === "new" ? "on" : "") + '">' + esc(x.tNew) + '</button>' +
          '<button type="button" id="ac-to" class="' + (MODE === "old" ? "on" : "") + '">' + esc(x.tOld) + '</button></div>' +
          '<input id="ac-mail" type="email" autocomplete="email" inputmode="email" placeholder="' + esc(x.mail) + '">' +
          '<input id="ac-pass" type="password" autocomplete="' + (MODE === "new" ? "new-password" : "current-password") + '" placeholder="' + esc(x.pass) + '">' +
          '<button type="button" class="btn gold" id="ac-go">' + esc(BUSY ? x.wait : (MODE === "new" ? x.goNew : x.goOld)) + '</button>' +
          (MODE === "old" ? '<button type="button" class="lnk" id="ac-fg">' + esc(x.forgot) + '</button>' : "");
    }
    if(ERR) h += '<p class="err">' + esc(ERR) + '</p>';
    if(MSG) h += '<p class="msg">' + esc(MSG) + '</p>';
    box.innerHTML = h;
    if($("ac-mail")){ $("ac-mail").value = keepMail; $("ac-pass").value = keepPass; }
    on("ac-out", signOut); on("ac-g", google);
    on("ac-e", function(){ SHOW_FORM = true; ERR = ""; paintAcct(); setTimeout(function(){ if($("ac-mail")) $("ac-mail").focus(); }, 30); });
    on("ac-tn", function(){ MODE = "new"; ERR = ""; MSG = ""; paintAcct(); });
    on("ac-to", function(){ MODE = "old"; ERR = ""; MSG = ""; paintAcct(); });
    on("ac-go", function(){ if(!BUSY) emailGo(); });
    on("ac-fg", reset);
    if($("ac-pass")) $("ac-pass").addEventListener("keydown", function(e){ if(e.key === "Enter" && !BUSY) emailGo(); });
  }
  function on(id, fn){ var el = $(id); if(el) el.addEventListener("click", fn); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }

  // ---- synchronisation avec /clients/{uid} ----
  function docUrl(){ return "https://firestore.googleapis.com/v1/" + ROOT + "clients/" + USER.uid; }
  function pull(){
    if(!USER) return;
    USER.getIdToken().then(function(tok){
      return fetch(docUrl(), { headers:{ Authorization:"Bearer " + tok } }).then(function(r){
        if(r.status === 404) return [];
        return r.ok ? r.json().then(function(d){
          var v = (((d.fields || {}).ids || {}).arrayValue || {}).values || [];
          return v.map(function(x){ return x.stringValue; }).filter(Boolean);
        }) : null;
      });
    }).then(function(cloud){
      if(cloud === null) return;
      var local = ids(), missing = cloud.filter(function(id){ return local.indexOf(id) < 0; });
      var needPush = local.some(function(id){ return cloud.indexOf(id) < 0; });
      if(!missing.length){ if(needPush) push(); return; }
      return batchGet(missing).then(function(map){
        missing.forEach(function(id){
          var d = map && map[id];
          if(d) FAV.push(snap(d));
          else if(d === undefined) FAV.push({ id:id, titre:"", _gone:false });
        });
        if(FAV.length > MAX) FAV.length = MAX;
        store(); refresh();
        if(needPush || (map && missing.some(function(id){ return map[id] === null; }))) push();
      });
    }).catch(function(){});
  }
  var PUSH_T = null;
  function pushSoon(){ if(!USER) return; clearTimeout(PUSH_T); PUSH_T = setTimeout(push, 700); }
  function push(){
    if(!USER) return;
    var list = FAV.filter(function(x){ return !x._gone; }).map(function(x){ return x.id; }).slice(0, MAX);
    USER.getIdToken().then(function(tok){
      return fetch(docUrl(), { method:"PATCH", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + tok },
        body: JSON.stringify({ fields:{
          ids:{ arrayValue:{ values: list.map(function(id){ return { stringValue:id }; }) } },
          updatedMs:{ integerValue: String(Date.now()) },
          email:{ stringValue: USER.email || "" } } }) });
    }).catch(function(){});
  }

  // ---- démarrage ----
  window.SPFav = { heart: heart, sheet: sheet };
  document.getElementById("lang").addEventListener("click", function(){ setTimeout(function(){ refresh(); paintAcct(); }, 0); });
  C.repaint();
  refresh();
  var signed = false; try{ signed = localStorage.getItem(KEY_SIGNED) === "1"; }catch(e){}
  if(signed) loadAuth().catch(function(){});
})();
</script>
<script>
/* Appli cliente « SanaaPro Style » : installation du catalogue seul,
   sans espace atelier ni connexion. */
(function(){
  var TX = {
    en:{ btn:"Install the app", ios:"To install the app: tap the Share button at the bottom of Safari, then “Add to Home Screen”." },
    fr:{ btn:"Installer l'appli", ios:"Pour installer l'appli : touchez le bouton Partager en bas de Safari, puis « Sur l'écran d'accueil »." }
  };
  var btn = document.getElementById("install"), help = document.getElementById("ioshelp");
  function lang(){ try{ return localStorage.getItem("sanaapro_site_lang") === "fr" ? "fr" : "en"; }catch(e){ return "en"; } }
  function standalone(){
    try{ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }catch(e){ return false; }
  }
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var deferred = null;
  function label(){
    var t = TX[lang()];
    btn.textContent = t.btn;
    document.getElementById("ioshelp-t").textContent = t.ios;
  }
  label();
  document.getElementById("lang").addEventListener("click", function(){ setTimeout(label, 0); });

  if(!standalone()){
    window.addEventListener("beforeinstallprompt", function(e){
      e.preventDefault(); deferred = e; btn.hidden = false;
    });
    if(isIOS) btn.hidden = false;
  }
  btn.addEventListener("click", function(){
    if(deferred){
      deferred.prompt();
      deferred.userChoice.then(function(){ deferred = null; btn.hidden = true; }).catch(function(){});
    } else if(isIOS){
      help.hidden = !help.hidden;
    }
  });
  document.getElementById("ioshelp-x").addEventListener("click", function(){ help.hidden = true; });
  window.addEventListener("appinstalled", function(){ btn.hidden = true; help.hidden = true; });

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
