<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>SanaaPro Catalogue — Gambian tailors</title>
<meta name="description" content="Browse designs from tailoring workshops across The Gambia and order on WhatsApp.">
<meta property="og:title" content="SanaaPro Catalogue — Gambian tailors">
<meta property="og:description" content="Designs from workshops across The Gambia. Order directly on WhatsApp.">
<meta property="og:image" content="https://sanaapro.github.io/tape-espace/icon-512.png">

<style>
  :root{
    --bg:#0E0E0F; --panel:#17171A; --line:#2A2A2F; --ink:#F3EEE3; --muted:#9C978C; --gold:#C9A227;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{ box-sizing:inherit }
  html,body{ margin:0; background:var(--bg); color:var(--ink) }
  body{ font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-text-size-adjust:100% }
  .wrap{ max-width:720px; margin:0 auto; padding:18px 16px 40px }
  header{ display:flex; align-items:center; gap:10px }
  header img{ width:32px; height:32px; border-radius:8px }
  .brand{ font-family:Georgia,"Times New Roman",serif; font-size:17px; flex:1 }
  .lang{ background:none; border:1px solid var(--line); color:var(--muted); border-radius:20px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer }
  h1{ font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:31px; line-height:1.18; margin:28px 0 8px; max-width:15em }
  .lead{ color:var(--muted); margin:0 0 22px; max-width:34em }

  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none }
  .chips::-webkit-scrollbar{ display:none }
  .chip{ flex:none; border:1px solid var(--line); background:none; color:var(--muted); border-radius:999px; padding:8px 15px; font:inherit; font-size:14px; cursor:pointer }
  .chip.on{ background:var(--gold); border-color:var(--gold); color:#16130B; font-weight:600 }
  select{ width:100%; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; margin-bottom:16px }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px }
  .item{ align-self:start; display:block; width:100%; background:none; border:0; padding:0; text-align:left; color:inherit; font:inherit; cursor:pointer }
  .item img{ display:block; width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; background:var(--panel) }
  .item .t{ margin-top:8px; font-size:14.5px; line-height:1.3 }
  .item .s{ font-size:12.5px; color:var(--muted); margin-top:2px }
  .item .p{ font-size:13px; color:var(--gold); margin-top:2px }
  .item:focus-visible,.chip:focus-visible,.cta:focus-visible{ outline:2px solid var(--gold); outline-offset:3px }

  .more{ display:block; margin:24px auto 0; background:none; border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px 22px; font:inherit; cursor:pointer }
  .state{ text-align:center; color:var(--muted); padding:50px 10px }
  .foot{ text-align:center; color:var(--muted); font-size:12.5px; margin-top:36px }
  .foot a{ color:var(--gold); text-decoration:none }

  /* fiche d'un modèle */
  #shv{ z-index:9 }
  .sheet{ position:fixed; inset:0; background:var(--bg); overflow-y:auto; z-index:10;
          padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px) }
  .sheet .in{ max-width:560px; margin:0 auto; padding:14px 16px 32px }
  .close{ background:none; border:1px solid var(--line); color:var(--ink); border-radius:20px; padding:6px 14px; font:inherit; font-size:14px; cursor:pointer }
  .big{ display:block; width:100%; margin-top:14px; border-radius:12px; background:var(--panel); min-height:240px; object-fit:cover }
  .sheet h2{ font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:26px; margin:18px 0 4px }
  .who{ color:var(--muted); margin:0 }
  .price{ color:var(--gold); font-size:17px; margin:10px 0 0 }
  .cta{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; min-height:52px; margin-top:22px;
        background:var(--gold); color:#16130B; border-radius:12px; font-weight:600; font-size:16px; text-decoration:none }
  .cta svg{ width:20px; height:20px }
  .wave{ margin-top:16px; border:1px solid var(--line); border-radius:12px; padding:14px 16px; text-align:center }
  .wave .wt{ display:block; color:var(--muted); font-size:13.5px }
  .wave .wn{ display:block; font-size:22px; letter-spacing:.5px; margin:4px 0 2px; color:#1DC8F2; font-weight:600 }
  .wave .wh{ display:block; color:var(--muted); font-size:12.5px; margin-top:6px; line-height:1.4 }
  .wave button{ margin-top:10px; background:none; border:1px solid var(--line); color:var(--ink); border-radius:20px; padding:7px 16px; font:inherit; font-size:13.5px; cursor:pointer }
  .wave button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px }
  .wave .wavego{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:52px; margin:0 0 12px;
         background:#1DC8F2; color:#04121A; border:0; border-radius:12px; font-size:16.5px; font-weight:700 }
  .wave .wavego .wl{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%;
         background:#04121A; color:#1DC8F2; font-size:15px; font-weight:800 }
  /* ateliers */
  .shops-t{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:6px 0 8px }
  .shops{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px; scrollbar-width:none }
  .shops::-webkit-scrollbar{ display:none }
  .shop{ flex:none; display:flex; flex-direction:column; gap:2px; min-width:150px; max-width:220px; padding:12px 14px;
         border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--ink); text-decoration:none }
  .shop b{ font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:16px; line-height:1.25 }
  .shop span{ font-size:12.5px; color:var(--muted) }
  .shop .n{ color:var(--gold) }
  .shop:focus-visible,.shopbar a:focus-visible,.shopbar button:focus-visible,.seeshop:focus-visible{ outline:2px solid var(--gold); outline-offset:2px }
  .shopbar{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 22px }
  .shopbar a,.shopbar button{ flex:1 1 150px; display:flex; align-items:center; justify-content:center; min-height:46px; border-radius:11px;
         font:inherit; font-weight:600; font-size:14.5px; text-decoration:none; cursor:pointer }
  .shopbar a{ background:var(--gold); color:#16130B; border:0 }
  .shopbar button{ background:none; color:var(--ink); border:1px solid var(--line) }
  .seeshop{ display:block; margin-top:18px; padding:13px 14px; border:1px solid var(--line); border-radius:12px; color:var(--gold); text-decoration:none; text-align:center }
  /* sélection de plusieurs modèles */
  .cell{ position:relative; align-self:start }
  .pick{ position:absolute; top:7px; right:7px; width:42px; height:42px; padding:0; border-radius:50%;
         border:1.5px solid rgba(255,255,255,.9); background:rgba(14,14,15,.6); color:#fff;
         display:flex; align-items:center; justify-content:center; cursor:pointer }
  .pick svg{ width:20px; height:20px }
  .pick.on{ background:var(--gold); border-color:var(--gold); color:#16130B }
  .pick:focus-visible{ outline:2px solid var(--gold); outline-offset:2px }
  .cell.on .item img{ outline:3px solid var(--gold); outline-offset:-3px }
  .selbar{ position:fixed; z-index:5; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
           max-width:560px; margin:0 auto; display:flex; align-items:center; gap:10px; min-height:56px; padding:8px 8px 8px 14px;
           background:var(--gold); color:#16130B; border:0; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.45);
           font:inherit; font-weight:600; font-size:15px; text-align:left; cursor:pointer }
  .selbar .cnt{ flex:none; display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 8px;
                border-radius:999px; background:#16130B; color:var(--gold); font-weight:700 }
  .selbar .go{ flex:none; margin-left:auto; padding:9px 14px; border-radius:10px; background:#16130B; color:var(--gold); white-space:nowrap }
  .selbar:focus-visible{ outline:2px solid #fff; outline-offset:2px }
  body.hasbar .wrap{ padding-bottom:110px }
  .addsel{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px; margin-top:12px;
           background:none; border:1px solid var(--gold); color:var(--gold); border-radius:12px; font:inherit; font-weight:600; font-size:15.5px; cursor:pointer }
  .addsel.on{ border-color:var(--line); color:var(--muted) }
  .addsel:focus-visible{ outline:2px solid var(--gold); outline-offset:2px }
  .grp{ margin-top:22px; padding-top:16px; border-top:1px solid var(--line) }
  .grp h3{ font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:19px; margin:0 0 2px }
  .grp .q{ color:var(--muted); font-size:13px; margin:0 0 6px }
  .row{ display:flex; align-items:center; gap:12px; padding:9px 0 }
  .row img,.row .ph{ flex:none; width:52px; height:68px; object-fit:cover; border-radius:8px; background:var(--panel) }
  .row .tx{ flex:1; min-width:0 }
  .row .tx b{ display:block; font-weight:normal; font-size:15px; line-height:1.3 }
  .row .tx span{ display:block; font-size:12.5px; color:var(--muted) }
  .row .tx i{ display:block; font-style:normal; font-size:13px; color:var(--gold) }
  .row .rm{ flex:none; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:none; color:var(--muted); font-size:20px; line-height:1; cursor:pointer }
  .row .rm:focus-visible{ outline:2px solid var(--gold); outline-offset:2px }
  .sub{ display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:14px; margin:6px 0 0 }
  .sub b{ color:var(--gold); font-weight:600 }
  .grp .cta{ margin-top:12px }
  .shitem{ display:block; width:100%; margin-top:20px; padding:0; background:none; border:0; color:inherit; font:inherit; text-align:left; cursor:pointer }
  .shitem img{ display:block; width:100%; max-height:520px; object-fit:cover; border-radius:12px; background:var(--panel); min-height:200px }
  .shitem .n{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:var(--gold); color:#16130B; font-weight:700; font-size:13.5px; margin-right:8px }
  .shitem b{ display:flex; align-items:center; font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:20px; margin-top:12px }
  .shitem span{ display:block; color:var(--muted); font-size:13px; margin-top:2px }
  .shitem i{ display:block; font-style:normal; color:var(--gold); font-size:15.5px; margin-top:2px }
  .shitem:focus-visible{ outline:2px solid var(--gold); outline-offset:3px }
  #shv-total{ margin-top:22px; padding-top:14px; border-top:1px solid var(--line); font-size:15px }
  .note{ color:var(--muted); font-size:13px; line-height:1.45; margin:22px 0 0 }
  .clear{ display:block; margin:18px auto 0; background:none; border:0; color:var(--muted); text-decoration:underline; font:inherit; font-size:14px; cursor:pointer; padding:10px }
  [hidden]{ display:none !important }
</style>
</head>

    </div>
    <a class="seeshop" id="s-shop" hidden></a>
  </div>
</div>

<button type="button" class="selbar" id="selbar" hidden><span class="cnt" id="selbar-n"></span><span id="selbar-t"></span><span class="go" id="selbar-go"></span></button>

<div class="sheet" id="shv" hidden role="dialog" aria-modal="true" aria-labelledby="shv-h">
  <div class="in">
    <button class="close" id="shv-close" type="button"></button>
    <h2 id="shv-h"></h2>
    <p class="who" id="shv-lead"></p>
    <div id="shv-list"></div>
    <div class="sub" id="shv-total" hidden></div>

</div>

<div class="sheet" id="selp" hidden role="dialog" aria-modal="true" aria-labelledby="selp-h">

    <div id="selp-list"></div>
    <p class="note" id="selp-note"></p>
    <button type="button" class="clear" id="selp-clear"></button>
  </div>
</div>

      { fieldFilter:{ field:{ fieldPath:"__name__" }, op:"GREATER_THAN_OR_EQUAL", value:{ referenceValue: ref0 } } },
      { fieldFilter:{ field:{ fieldPath:"__name__" }, op:"LESS_THAN", value:{ referenceValue: ref0 + "\uf8ff" } } } ] } } } };
    return fetch(BASE.replace(/\/$/, "") + ":runQuery?key=" + KEY, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){ var d = (rows || []).filter(function(x){ return x.document; })[0]; return d ? parse(d.document) : null; })
      .catch(function(){ return null; });
  }
  function openShared(getters){
    var t = L(), n0 = getters.length;
    $("shv-close").textContent = t.shBack; $("shv-h").textContent = n0 === 1 ? t.shH1 : t.shH.replace("{n}", n0);
    $("shv-lead").textContent = t.shLead;
    $("shv").hidden = false; document.body.style.overflow = "hidden";
    Promise.all(getters.map(function(g){ return g(); })).then(function(docs){
      var box = $("shv-list"); box.innerHTML = "";
      var ok = docs.filter(function(o){ return o && live(o); }), total = 0, priced = 0, dev = "D";
      if(!ok.length){ var e = document.createElement("p"); e.className = "note"; e.textContent = t.shNone; box.appendChild(e); return; }
      ok.forEach(function(o, i){
        var b = document.createElement("button"); b.type = "button"; b.className = "shitem";
        var im = document.createElement("img"); im.src = o.thumb || ""; im.alt = o.titre || ""; b.appendChild(im);
        var h = document.createElement("b"); var n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
        h.appendChild(n); h.appendChild(document.createTextNode(o.titre || "—")); b.appendChild(h);
        var w = document.createElement("span"); w.textContent = t.ref + " " + ref(o) + " · " + (o.boutique || "") + (o.quartier ? " · " + o.quartier : ""); b.appendChild(w);
        if(o.prix !== null && o.prix !== undefined){ var p = document.createElement("i"); p.textContent = t.from + " " + money(o); b.appendChild(p); total += Number(o.prix); priced++; dev = o.devise || dev; }
        b.addEventListener("click", function(){ openSheet(o); });
        box.appendChild(b);
        fetch(BASE + "catalogue_photos/" + o.id + "?key=" + KEY).then(function(r){ return r.ok ? r.json() : null; })
          .then(function(j){ var ph = j && val((j.fields||{}).photo); if(ph) im.src = ph; }).catch(function(){});
      });
      if(priced > 1){
        var tt = $("shv-total"); tt.innerHTML = "";
        var a1 = document.createElement("span"); a1.textContent = t.shTotal;
        var a2 = document.createElement("b"); a2.textContent = t.from + " " + amt(total, dev);
        tt.appendChild(a1); tt.appendChild(a2); tt.hidden = false;
      }
    });
  }
  $("shv-close").addEventListener("click", function(){
    $("shv").hidden = true; document.body.style.overflow = "";
    try{ history.replaceState(null, "", location.pathname); }catch(e){}
  });

  paint(); load();
  if(SHARED.length) openShared(SHARED.map(function(id){ return function(){ return byId(id); }; }));
  else if(PREFIXES.length === 1) byPrefix(PREFIXES[0]).then(function(o){ if(o) openSheet(o); });
  else if(PREFIXES.length) openShared(PREFIXES.map(function(px){ return function(){ return byPrefix(px); }; }));
  if(PICK){
    fetch(BASE + "catalogue/" + encodeURIComponent(PICK) + "?key=" + KEY).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ if(d && d.name) openSheet(parse(d)); }).catch(function(){});
  }
})();
