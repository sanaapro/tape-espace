<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0F">
<title>SanaaPro Catalogue — Gambian tailors</title>
<meta name="description" content="Browse designs from tailoring workshops across The Gambia and order on WhatsApp.">
<meta property="og:title" content="SanaaPro Catalogue — Gambian tailors">
<meta property="og:description" content="Designs from workshops across The Gambia. Order directly on WhatsApp.">
<meta property="og:image" content="https://sanaapro.github.io/tape-espace/icon-512.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://firestore.googleapis.com">
<style>
  :root{
    --bg:#0E0E0F; --panel:#17171A; --line:#2A2A2F; --ink:#F3EEE3; --muted:#9C978C; --gold:#C9A227;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{ box-sizing:inherit }
  html,body{ margin:0; background:var(--bg); color:var(--ink) }
  body{ font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-text-size-adjust:100% }
  .wrap{ max-width:720px; margin:0 auto; padding:18px 16px 40px }
  header{ display:flex; align-items:center; gap:10px }
  header img{ width:32px; height:32px; border-radius:8px }
  .brand{ font-family:Georgia,"Times New Roman",serif; font-size:17px; flex:1 }
  .lang{ background:none; border:1px solid var(--line); color:var(--muted); border-radius:20px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer }
  h1{ font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:31px; line-height:1.18; margin:28px 0 8px; max-width:15em }
  .lead{ color:var(--muted); margin:0 0 22px; max-width:34em }

  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none }
  .chips::-webkit-scrollbar{ display:none }
  .chip{ flex:none; border:1px solid var(--line); background:none; color:var(--muted); border-radius:999px; padding:8px 15px; font:inherit; font-size:14px; cursor:pointer }
  .chip.on{ background:var(--gold); border-color:var(--gold); color:#16130B; font-weight:600 }
  select{ width:100%; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; margin-bottom:16px }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px }
  .item{ align-self:start; display:block; width:100%; background:none; border:0; padding:0; text-align:left; color:inherit; font:inherit; cursor:pointer }
  .item img{ display:block; width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; background:var(--panel) }
  .item .t{ margin-top:8px; font-size:14.5px; line-height:1.3 }
  .item .s{ font-size:12.5px; color:var(--muted); margin-top:2px }
  .item .p{ font-size:13px; color:var(--gold); margin-top:2px }
  .item:focus-visible,.chip:focus-visible,.cta:focus-visible{ outline:2px solid var(--gold); outline-offset:3px }

  .more{ display:block; margin:24px auto 0; background:none; border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px 22px; font:inherit; cursor:pointer }
  .state{ text-align:center; color:var(--muted); padding:50px 10px }
  .foot{ text-align:center; color:var(--muted); font-size:12.5px; margin-top:36px }
  .foot a{ color:var(--gold); text-decoration:none }

  /* fiche d'un modèle */
  .sheet{ position:fixed; inset:0; background:var(--bg); overflow-y:auto; z-index:10;
          padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px) }
  .sheet .in{ max-width:560px; margin:0 auto; padding:14px 16px 32px }
  .close{ background:none; border:1px solid var(--line); color:var(--ink); border-radius:20px; padding:6px 14px; font:inherit; font-size:14px; cursor:pointer }
  .big{ display:block; width:100%; margin-top:14px; border-radius:12px; background:var(--panel); min-height:240px; object-fit:cover }
  .sheet h2{ font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:26px; margin:18px 0 4px }
  .who{ color:var(--muted); margin:0 }
  .price{ color:var(--gold); font-size:17px; margin:10px 0 0 }
  .cta{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; min-height:52px; margin-top:22px;
        background:var(--gold); color:#16130B; border-radius:12px; font-weight:600; font-size:16px; text-decoration:none }
  .cta svg{ width:20px; height:20px }
  [hidden]{ display:none !important }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon-192.png" alt="" width="32" height="32">
    <div class="brand">SanaaPro</div>
    <button class="lang" id="lang" type="button">FR</button>
  </header>

  <a id="allshops" href="catalogue.html" hidden style="display:inline-block;margin-top:22px;color:var(--gold);text-decoration:none;font-size:14px"></a>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>

  <div class="chips" id="chips"></div>
  <select id="shop" aria-label="Workshop"></select>

  <div class="grid" id="grid"></div>
  <div class="state" id="state"></div>
  <button class="more" id="more" hidden></button>

  <p class="foot"><span id="foot"></span> <a href="https://sanaapro.github.io/">SanaaPro</a></p>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="in">
    <button class="close" id="close" type="button"></button>
    <img class="big" id="big" alt="">
    <h2 id="s-title"></h2>
    <p class="who" id="s-who"></p>
    <p class="price" id="s-price"></p>
    <a class="cta" id="s-cta" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3Z"/></svg>
      <span id="s-cta-t"></span>
    </a>
  </div>
</div>

<script>
(function(){
  var BASE = "https://firestore.googleapis.com/v1/projects/sanaapro-app/databases/(default)/documents/";
  var KEY = "AIzaSyCqfAGGU7yFs_QYg70u3e5cNYPXQjRHzsI";
  var T = {
    en:{ h1:"Tailors of The Gambia, in one catalogue.", lead:"Browse designs from workshops near you, then order directly from the tailor on WhatsApp.",
         all:"All", femme:"Women", homme:"Men", enfant:"Children", allShops:"All workshops",
         loading:"Loading designs…", empty:"No designs here yet.", net:"Can't reach the catalogue. Check your connection and try again.",
         more:"Show more", from:"from", back:"‹ Back", order:"Order on WhatsApp",
         msg:"Hello, I saw your design \u201c{t}\u201d on the SanaaPro catalogue. I would like to order it.",
         foot:"Catalogue by", other:"FR", seeAll:"‹ See all workshops", shopLead:"Pick a design and order directly on WhatsApp." },
    fr:{ h1:"Les couturiers de Gambie, dans un seul catalogue.", lead:"Parcourez les modèles des ateliers près de chez vous, puis commandez directement au couturier sur WhatsApp.",
         all:"Tous", femme:"Femme", homme:"Homme", enfant:"Enfant", allShops:"Tous les ateliers",
         loading:"Chargement des modèles…", empty:"Aucun modèle ici pour l'instant.", net:"Impossible de joindre le catalogue. Vérifiez votre connexion puis réessayez.",
         more:"Voir plus", from:"dès", back:"‹ Retour", order:"Commander sur WhatsApp",
         msg:"Bonjour, j'ai vu votre modèle \u00ab {t} \u00bb sur le catalogue SanaaPro. Je voudrais le commander.",
         foot:"Catalogue par", other:"EN", seeAll:"‹ Voir tous les ateliers", shopLead:"Choisissez un modèle et commandez directement sur WhatsApp." }
  };
  var LANG = "en";
  try{ LANG = localStorage.getItem("sanaapro_site_lang") === "fr" ? "fr" : "en"; }catch(e){}
  var ITEMS = [], NEXT = null, GENRE = "all", SHOP = "", LOADING = false, FAILED = false, CURRENT = null;
  var ONLY = "";
  try{ ONLY = new URLSearchParams(location.search).get("a") || ""; }catch(e){}
  if(ONLY) SHOP = ONLY;
  var $ = function(id){ return document.getElementById(id); };
  function L(){ return T[LANG]; }

  function val(f){
    if(!f) return null;
    if("stringValue" in f) return f.stringValue;
    if("integerValue" in f) return Number(f.integerValue);
    if("doubleValue" in f) return f.doubleValue;
    return null;
  }
  function parse(d){
    var o = { id: d.name.split("/").pop() }, f = d.fields || {};
    Object.keys(f).forEach(function(k){ o[k] = val(f[k]); });
    return o;
  }
  function money(o){ return Math.round(o.prix).toLocaleString(LANG==="fr"?"fr-FR":"en-GB") + " " + (o.devise || "D"); }

  function shopQuery(field){
    var body = { structuredQuery: { from:[{ collectionId:"catalogue" }],
      where:{ fieldFilter:{ field:{ fieldPath:field }, op:"EQUAL", value:{ stringValue: ONLY } } }, limit: 300 } };
    return fetch(BASE.replace(/\/$/, "") + ":runQuery?key=" + KEY, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) })
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){ return rows.filter(function(x){ return x.document; }); });
  }
  function loadShop(){
    LOADING = true; paintState();
    shopQuery("slug")
    .then(function(rows){ return rows.length ? rows : shopQuery("bid"); })
    .then(function(rows){
      rows.forEach(function(x){ ITEMS.push(parse(x.document)); });
      if(ITEMS.length) SHOP = ITEMS[0].bid || SHOP;
      ITEMS.sort(function(a,b){ return (Number(b.createdMs)||0) - (Number(a.createdMs)||0); });
      NEXT = null; FAILED = false;
    }).catch(function(){ FAILED = true; })
    .then(function(){ LOADING = false; paint(); });
  }
  function load(){
    if(ONLY) return loadShop();
    if(LOADING) return; LOADING = true; paintState();
    var url = BASE + "catalogue?pageSize=24&orderBy=createdMs%20desc&key=" + KEY + (NEXT ? "&pageToken=" + encodeURIComponent(NEXT) : "");
    fetch(url, { cache:"no-store" }).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      (j.documents || []).forEach(function(d){ ITEMS.push(parse(d)); });
      NEXT = j.nextPageToken || null; FAILED = false;
    }).catch(function(){ FAILED = true; })
    .then(function(){ LOADING = false; paint(); });
  }

  function paintState(){
    var st = $("state");
    if(LOADING && !ITEMS.length){ st.textContent = L().loading; st.hidden = false; }
  }

  function paint(){
    var t = L();
    document.documentElement.lang = LANG;
    $("lang").textContent = t.other; $("h1").textContent = t.h1; $("lead").textContent = t.lead;
    $("foot").textContent = t.foot; $("close").textContent = t.back; $("s-cta-t").textContent = t.order;
    $("more").textContent = t.more;
    $("allshops").hidden = !ONLY; $("allshops").textContent = t.seeAll;
    if(ONLY && ITEMS.length){ $("h1").textContent = ITEMS[0].boutique || t.h1; $("lead").textContent = (ITEMS[0].quartier ? ITEMS[0].quartier + " · " : "") + t.shopLead; }

    var chips = $("chips"); chips.innerHTML = "";
    ["all","femme","homme","enfant"].forEach(function(g){
      var b = document.createElement("button"); b.type = "button";
      b.className = "chip" + (GENRE===g ? " on" : ""); b.textContent = t[g];
      b.addEventListener("click", function(){ GENRE = g; paint(); });
      chips.appendChild(b);
    });

    var shops = {}; ITEMS.forEach(function(o){ if(o.bid) shops[o.bid] = o.boutique + (o.quartier ? " · " + o.quartier : ""); });
    var sel = $("shop"); sel.innerHTML = "";
    var o0 = document.createElement("option"); o0.value = ""; o0.textContent = t.allShops; sel.appendChild(o0);
    Object.keys(shops).sort(function(a,b){ return shops[a].localeCompare(shops[b]); }).forEach(function(k){
      var o = document.createElement("option"); o.value = k; o.textContent = shops[k]; sel.appendChild(o);
    });
    sel.value = SHOP;
    sel.hidden = Object.keys(shops).length < 2;

    var list = ITEMS.filter(function(o){
      return (GENRE==="all" || o.genre===GENRE) && (!SHOP || o.bid===SHOP);
    });
    var grid = $("grid"); grid.innerHTML = "";
    list.forEach(function(o){
      var b = document.createElement("button"); b.type = "button"; b.className = "item";
      var im = document.createElement("img"); im.src = o.thumb || ""; im.alt = o.titre || ""; im.loading = "lazy"; b.appendChild(im);
      var a = document.createElement("div"); a.className = "t"; a.textContent = o.titre || ""; b.appendChild(a);
      var s = document.createElement("div"); s.className = "s"; s.textContent = (o.boutique||"") + (o.quartier ? " · " + o.quartier : ""); b.appendChild(s);
      if(o.prix !== null && o.prix !== undefined){ var p = document.createElement("div"); p.className = "p"; p.textContent = t.from + " " + money(o); b.appendChild(p); }
      b.addEventListener("click", function(){ openSheet(o); });
      grid.appendChild(b);
    });

    var st = $("state");
    if(FAILED && !ITEMS.length){ st.textContent = t.net; st.hidden = false; }
    else if(LOADING && !ITEMS.length){ st.textContent = t.loading; st.hidden = false; }
    else if(!list.length){ st.textContent = t.empty; st.hidden = false; }
    else st.hidden = true;
    $("more").hidden = !NEXT || LOADING;
    if(CURRENT) fillSheet(CURRENT);
  }

  function fillSheet(o){
    var t = L();
    $("s-title").textContent = o.titre || "";
    $("s-who").textContent = (o.boutique||"") + (o.quartier ? " · " + o.quartier : "");
    $("s-price").textContent = (o.prix !== null && o.prix !== undefined) ? t.from + " " + money(o) : "";
    if(o.wa){
      $("s-cta").href = "https://wa.me/" + o.wa + "?text=" + encodeURIComponent(t.msg.replace("{t}", o.titre || ""));
      $("s-cta").hidden = false;
    } else $("s-cta").hidden = true;
  }
  function openSheet(o){
    CURRENT = o; fillSheet(o);
    var big = $("big"); big.src = o.thumb || "";
    $("sheet").hidden = false; document.body.style.overflow = "hidden";
    history.pushState({ sheet:1 }, "");
    fetch(BASE + "catalogue_photos/" + o.id + "?key=" + KEY).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if(j && CURRENT === o){ var p = val((j.fields||{}).photo); if(p) big.src = p; } }).catch(function(){});
  }
  function closeSheet(){ CURRENT = null; $("sheet").hidden = true; document.body.style.overflow = ""; }

  $("close").addEventListener("click", function(){ history.back(); });
  window.addEventListener("popstate", function(){ if(!$("sheet").hidden) closeSheet(); });
  $("shop").addEventListener("change", function(){ SHOP = $("shop").value; paint(); });
  $("more").addEventListener("click", load);
  $("lang").addEventListener("click", function(){
    LANG = LANG==="en" ? "fr" : "en";
    try{ localStorage.setItem("sanaapro_site_lang", LANG); }catch(e){}
    paint();
  });

  paint(); load();
})();
</script>
</body>
</html>
