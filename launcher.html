<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SanaaPro — Tableaux de bord</title>
  <link rel="manifest" href="manifest-launcher.json">
  <link rel="icon" href="icon-launcher-192.png">
  <link rel="apple-touch-icon" href="icon-launcher-512.png">
  <meta name="theme-color" content="#0E0E0F">
  <meta name="description" content="Accès rapide aux tableaux de bord SanaaPro et Djamil Couture.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0E0E0F 0%, #1A1A1B 100%);
      color: #F5F5F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 50px;
      margin-top: 20px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #D4A574;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 14px;
      color: #A9A9A9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .tile {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 30px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid transparent;
      text-decoration: none;
      color: inherit;
      min-height: 140px;
      position: relative;
      overflow: hidden;
    }

    .tile::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s;
      pointer-events: none;
    }

    .tile:active::before {
      left: 100%;
    }

    .tile-admin {
      background: linear-gradient(135deg, #1A2A3A 0%, #0E0E0F 100%);
      border-color: #D4A574;
    }

    .tile-admin:hover {
      background: linear-gradient(135deg, #2A3A4A 0%, #1A1A1B 100%);
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(212, 165, 116, 0.2);
    }

    .tile-shop {
      background: linear-gradient(135deg, #2A1A0A 0%, #0E0E0F 100%);
      border-color: #D4A574;
    }

    .tile-shop:hover {
      background: linear-gradient(135deg, #3A2A1A 0%, #1A1A1B 100%);
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(212, 165, 116, 0.2);
    }

    .tile-icon {
      font-size: 48px;
      margin-bottom: 15px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .tile-title {
      font-size: 18px;
      font-weight: 600;
      color: #D4A574;
      margin-bottom: 8px;
      text-align: center;
    }

    .tile-desc {
      font-size: 12px;
      color: #A9A9A9;
      text-align: center;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #6A6A6A;
      padding-top: 20px;
      border-top: 1px solid #2A2A2B;
    }

    .install-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #D4A574;
      color: #0E0E0F;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      box-shadow: 0 4px 12px rgba(212, 165, 116, 0.3);
      transition: all 0.3s;
      z-index: 100;
    }

    .install-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(212, 165, 116, 0.4);
    }

    .install-btn.show {
      display: block;
    }

    @media (min-width: 768px) {
      .container {
        flex-direction: row;
        gap: 30px;
      }

      .tile {
        min-height: auto;
      }

      .header {
        margin-bottom: 60px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .header {
        margin-bottom: 30px;
        margin-top: 10px;
      }

      .header h1 {
        font-size: 24px;
      }

      .tile {
        padding: 30px 20px;
        min-height: 120px;
      }

      .tile-icon {
        font-size: 40px;
        margin-bottom: 12px;
      }

      .tile-title {
        font-size: 16px;
      }

      .tile-desc {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>SanaaPro</h1>
    <p>Tableaux de bord</p>
  </div>

  <div class="container">
    <a href="https://sanaapro.github.io/tape-espace/admin.html" class="tile tile-admin" onclick="trackClick('admin')">
      <div class="tile-icon">👥</div>
      <div class="tile-title">Admin</div>
      <div class="tile-desc">Voir tous les abonnés et gérer les formules</div>
    </a>

    <a href="https://sanaapro.github.io/tape-espace/" class="tile tile-shop" onclick="trackClick('shop')">
      <div class="tile-icon">🛍️</div>
      <div class="tile-title">Djamil Couture</div>
      <div class="tile-desc">Gérer commandes, mesures et finances</div>
    </a>
  </div>

  <div class="footer">
    <p>SanaaPro — La gestion d'atelier complète</p>
  </div>

  <button class="install-btn" id="installBtn">Installer l'application</button>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw-launcher.js').catch(err => {
        console.log('SW registration failed:', err);
      });
    }

    // Install prompt
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.add('show');
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response: ${outcome}`);
        deferredPrompt = null;
        installBtn.classList.remove('show');
      }
    });

    window.addEventListener('appinstalled', () => {
      console.log('PWA installed');
      installBtn.classList.remove('show');
    });

    function trackClick(target) {
      console.log(`Clicked: ${target}`);
    }
  </script>
</body>
</html>
