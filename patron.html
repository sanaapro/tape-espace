<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patron sur mesure — essai SanaaPro</title>
<style>
:root{--bg:#0E0E0F;--card:#17171A;--line:#2A2A2F;--or:#C9A227;--txt:#EDE9E1;--soft:#9A968E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,sans-serif;padding:14px}
h1{font-family:Georgia,serif;color:var(--or);font-size:21px;margin:0 0 2px}
.sub{color:var(--soft);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{flex:1;min-width:120px;padding:11px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--txt);font:inherit;font-family:Georgia,serif}
.tab.on{border-color:var(--or);color:var(--or)}
label{display:block;font-size:12px;color:var(--soft);margin:0 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0E0E0F;color:var(--txt);font:inherit}
input:focus{outline:2px solid var(--or);outline-offset:1px}
.f.miss input{border-color:#7a5b18}
.f.miss label:after{content:" •";color:var(--or)}
button.go{width:100%;padding:14px;margin-top:14px;border:none;border-radius:10px;background:var(--or);color:#0E0E0F;font:600 16px Georgia,serif}
button.go[disabled]{opacity:.5}
.note{font-size:12px;color:var(--soft);margin-top:10px}
#out{background:#fff;border-radius:10px;overflow:auto;margin-top:14px;max-height:70vh;display:none}
#out svg{width:100%;height:auto;display:block}
.msg{font-size:13px;margin-top:10px}
.err{color:#E0685A}
.ok{color:#6FBF73}
.dl{display:none;margin-top:10px;text-align:center;padding:12px;border:1px solid var(--or);border-radius:10px;color:var(--or);text-decoration:none;font-family:Georgia,serif}
</style>
</head>
<body>

<h1>Patron sur mesure</h1>
<p class="sub">Essai — FreeSewing branché sur les mesures SanaaPro. Toutes les valeurs en centimètres.</p>

<div class="tabs">
  <button class="tab on" data-d="Simon">Chemise homme</button>
  <button class="tab" data-d="Titan">Pantalon</button>
  <button class="tab" data-d="Brian">Bloc de base</button>
</div>

<div class="card">
  <div class="grid" id="champs"></div>
  <button class="go" id="go">Tracer le patron</button>
  <p class="note">Les mesures marquées <span style="color:var(--or)">•</span> ne sont pas dans tes carnets actuels : il faudra les ajouter pour que le patron soit juste.</p>
  <div class="msg" id="msg"></div>
</div>

<a class="dl" id="dl" download="patron.svg">Télécharger le patron (SVG)</a>
<div id="out"></div>

<script src="freesewing.js"></script>
<script>
// mesures FreeSewing -> libellé métier + correspondance avec les carnets SanaaPro
const M = {
  neck:            ["Tour de cou","cou"],
  chest:           ["Tour de poitrine","poitrine"],
  waist:           ["Tour de taille","taille"],
  hips:            ["Tour de bassin","bassin"],
  seat:            ["Tour de bassin (siège)","bassin"],
  biceps:          ["Tour de manche (biceps)","tour manche"],
  wrist:           ["Tour de poignet","poignet"],
  knee:            ["Tour de genou","genou"],
  shoulderToShoulder:["Carrure (épaule à épaule)","épaule"],
  shoulderToWrist: ["Longueur de manche","long. manche"],
  hpsToWaistBack:  ["Longueur de taille dos","longueur de taille"],
  waistToFloor:    ["Longueur de pantalon","longueur pantalon"],
  hpsToBust:       ["Épaule à poitrine",null],
  shoulderSlope:   ["Tombé d'épaule",null],
  waistToArmpit:   ["Taille à l'aisselle",null],
  waistToHips:     ["Taille au bassin",null],
  waistToSeat:     ["Taille au siège",null],
  waistToKnee:     ["Taille au genou",null],
  waistToUpperLeg: ["Taille à l'entrejambe",null],
  waistBack:       ["Taille, moitié dos",null],
  seatBack:        ["Bassin, moitié dos",null],
  crossSeam:       ["Montant total",null],
  crossSeamFront:  ["Montant devant",null]
};
// valeurs de départ raisonnables (cm) pour un homme moyen
const D = {neck:40,chest:108,waist:94,hips:96,seat:96,biceps:33.5,wrist:19,knee:40,
 shoulderToShoulder:46.5,shoulderToWrist:65,hpsToWaistBack:46.5,waistToFloor:108,
 hpsToBust:28,shoulderSlope:8,waistToArmpit:21,waistToHips:14.5,waistToSeat:24,
 waistToKnee:58,waistToUpperLeg:30,waistBack:47,seatBack:50,crossSeam:75,crossSeamFront:35};

let design = "Simon";
const $ = s => document.querySelector(s);

function besoins(){
  const C = window.FS[design];
  return C.patternConfig?.measurements || C.designConfig?.measurements || [];
}

function dessineChamps(){
  $("#champs").innerHTML = besoins().map(k=>{
    const [lib, carnet] = M[k] || [k, null];
    return `<div class="f ${carnet?"":"miss"}">
      <label for="i-${k}">${lib}${carnet?` <span style="color:#6b675f">(${carnet})</span>`:""}</label>
      <input id="i-${k}" type="number" step="0.5" inputmode="decimal" value="${D[k]??""}">
    </div>`;
  }).join("");
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); design = b.dataset.d; dessineChamps();
  $("#out").style.display="none"; $("#dl").style.display="none"; $("#msg").innerHTML="";
});

$("#go").onclick = ()=>{
  const msg = $("#msg"); msg.innerHTML = ""; 
  const mm = {};
  for (const k of besoins()){
    const v = parseFloat($("#i-"+k).value);
    if (!v){ msg.innerHTML = `<span class="err">Il manque : ${(M[k]||[k])[0]}</span>`; return; }
    mm[k] = v * 10; // cm -> mm
  }
  try{
    const p = new window.FS[design]({measurements: mm});
    p.draft();
    const svg = p.render();
    $("#out").innerHTML = svg;
    $("#out").style.display = "block";
    const blob = new Blob([svg], {type:"image/svg+xml"});
    $("#dl").href = URL.createObjectURL(blob);
    $("#dl").download = design.toLowerCase()+".svg";
    $("#dl").style.display = "block";
    msg.innerHTML = `<span class="ok">Patron tracé à l'échelle réelle. À imprimer en 100 %.</span>`;
  }catch(e){
    msg.innerHTML = `<span class="err">Le tracé a échoué : ${e.message}</span>`;
  }
};

if (!window.FS) { $("#msg").innerHTML = '<span class="err">Le fichier freesewing.js n\'est pas chargé — il doit être dans le même dossier que cette page.</span>'; $("#go").disabled = true; }
else dessineChamps();
</script>
</body>
</html>
